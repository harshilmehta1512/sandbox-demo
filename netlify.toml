[build]
  base    = "."
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[functions."analyze"]
  max_body_size = 6291456

[[redirects]]
  from   = "/api/analyze"
  to     = "/.netlify/functions/analyze"
  status = 200

[[redirects]]
  from   = "/api/health"
  to     = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
